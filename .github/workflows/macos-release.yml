name: macOS Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificates
        run: |
          echo "${{ secrets.MACOS_APP_CERT_P12 }}" | base64 --decode > /tmp/app_cert.p12
          echo "${{ secrets.MACOS_INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/installer_cert.p12
          echo "${{ secrets.MACOS_NOTARY_KEY_P8 }}" | base64 --decode > /tmp/notary_key.p8
          security create-keychain -p "" build.keychain
          security import /tmp/app_cert.p12 -k build.keychain -P "${{ secrets.MACOS_APP_CERT_PASSWORD }}" -T /usr/bin/codesign
          security import /tmp/installer_cert.p12 -k build.keychain -P "${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
      - name: Build macOS Release (unsigned)
        run: |
          xcodebuild -project macos/KMVirtualCamera.xcodeproj \
            -scheme KMVirtualCamera \
            -configuration Release \
            -derivedDataPath macos/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Sign extension and app
        run: |
          ext_path="macos/DerivedData/Build/Products/Release/KMVirtualCamera.app/Contents/Library/SystemExtensions/jp.yasagure.kmvirtualcamera.macos.camext.systemextension"
          codesign --force --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp --options runtime --entitlements macos/config/CameraExtension.entitlements "$ext_path"
          codesign --force --deep --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp --options runtime macos/DerivedData/Build/Products/Release/KMVirtualCamera.app
          codesign --verify --deep --strict --verbose=2 macos/DerivedData/Build/Products/Release/KMVirtualCamera.app
      - name: Create and sign DMG
        run: |
          mkdir -p dist-macos
          hdiutil create -volname "KMVirtualCamera" -srcfolder macos/DerivedData/Build/Products/Release/KMVirtualCamera.app -ov -format UDRW dist-macos/tmp.dmg
          mount_point=$(hdiutil attach -readwrite -noverify dist-macos/tmp.dmg | grep -o '/Volumes/.*')
          ln -sf /Applications "$mount_point/Applications"
          hdiutil detach "$mount_point"
          hdiutil convert dist-macos/tmp.dmg -format UDZO -o dist-macos/KMVirtualCamera.dmg
          rm -f dist-macos/tmp.dmg
          codesign --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp dist-macos/KMVirtualCamera.dmg
          codesign --verify --verbose=2 dist-macos/KMVirtualCamera.dmg
      - name: Notarize and staple
        run: |
          xcrun notarytool submit dist-macos/KMVirtualCamera.dmg \
            --key /tmp/notary_key.p8 \
            --key-id "${{ secrets.MACOS_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.MACOS_NOTARY_ISSUER }}" \
            --wait
          xcrun stapler staple dist-macos/KMVirtualCamera.dmg
          xcrun stapler validate dist-macos/KMVirtualCamera.dmg
          spctl -a -t open --context context:primary-signature -v dist-macos/KMVirtualCamera.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMVirtualCamera-macOS
          path: dist-macos/KMVirtualCamera.dmg
