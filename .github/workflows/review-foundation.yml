name: Review foundation
on:
  push:
    branches: [feature/macos-coremediaio-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Common contracts and sanitizers
        env:
          CC: clang
          CXX: clang++
        run: sh scripts/test_foundation.sh -DKM_ENABLE_SANITIZERS=ON -DKM_ENABLE_OPUS=ON
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloud
      - run: sh scripts/test_browser_protocol.sh
      - run: npm run --prefix cloud build
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S windows -B build/windows -DKM_ENABLE_OPUS=ON
      - run: cmake --build build/windows --config Release --target Receiver test_h264_depacketizer test_receiver_startup test_webrtc_dtls
      - run: ctest --test-dir build/windows -C Release --output-on-failure -R H264DepacketizerTest
  macos-components:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test_macos_foundation.sh
      - run: sh scripts/build_macos_rtc.sh
  macos-release:
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificates
        run: |
          echo "${{ secrets.MACOS_APP_CERT_P12 }}" | base64 --decode > /tmp/app_cert.p12
          echo "${{ secrets.MACOS_INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/installer_cert.p12
          echo "${{ secrets.MACOS_NOTARY_KEY_P8 }}" | base64 --decode > /tmp/notary_key.p8
          security create-keychain -p "" build.keychain
          security import /tmp/app_cert.p12 -k build.keychain -P "${{ secrets.MACOS_APP_CERT_PASSWORD }}" -T /usr/bin/codesign
          security import /tmp/installer_cert.p12 -k build.keychain -P "${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
      - name: Build macOS Release
        run: |
          xcodebuild -project macos/KMVirtualCamera.xcodeproj \
            -scheme KMVirtualCamera \
            -configuration Release \
            -derivedDataPath macos/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Sign extension and app
        run: |
          ext_path="macos/DerivedData/Build/Products/Release/KMVirtualCamera.app/Contents/Library/SystemExtensions/jp.yasagure.kmvirtualcamera.macos.camext.systemextension"
          codesign --force --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp --options runtime --entitlements macos/config/CameraExtension.entitlements "$ext_path"
          codesign --force --deep --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp --options runtime macos/DerivedData/Build/Products/Release/KMVirtualCamera.app
          codesign --verify --deep --strict --verbose=2 macos/DerivedData/Build/Products/Release/KMVirtualCamera.app
      - name: Create and sign DMG
        run: |
          mkdir -p dist-macos
          hdiutil create -volname "KMVirtualCamera" -srcfolder macos/DerivedData/Build/Products/Release/KMVirtualCamera.app -ov -format UDRW dist-macos/tmp.dmg
          mount_point=$(hdiutil attach -readwrite -noverify dist-macos/tmp.dmg | grep -o '/Volumes/.*')
          ln -sf /Applications "$mount_point/Applications"
          hdiutil detach "$mount_point"
          hdiutil convert dist-macos/tmp.dmg -format UDZO -o dist-macos/KMVirtualCamera.dmg
          rm -f dist-macos/tmp.dmg
          codesign --sign "Developer ID Application: Kenichi Matsumoto (K7VNGA9K78)" --timestamp dist-macos/KMVirtualCamera.dmg
          codesign --verify --verbose=2 dist-macos/KMVirtualCamera.dmg
      - name: Notarize and staple
        run: |
          xcrun notarytool submit dist-macos/KMVirtualCamera.dmg \
            --key /tmp/notary_key.p8 \
            --key-id "${{ secrets.MACOS_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.MACOS_NOTARY_ISSUER }}" \
            --wait
          xcrun stapler staple dist-macos/KMVirtualCamera.dmg
          xcrun stapler validate dist-macos/KMVirtualCamera.dmg
          spctl -a -t open --context context:primary-signature -v dist-macos/KMVirtualCamera.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMVirtualCamera-macOS
          path: dist-macos/KMVirtualCamera.dmg
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create self-signed certificate
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=KM Virtual Camera Project" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "1111" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:TEMP\kmvcam.pfx" -Password $pwd
          echo "PFX_PATH=$env:TEMP\kmvcam.pfx" >> $env:GITHUB_ENV
      - run: cmake -S windows -B build/windows -DKM_ENABLE_OPUS=ON
      - run: cmake --build build/windows --config Release
      - run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Sign binaries
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (Test-Path $signtool) {
            & $signtool sign /v /fd SHA256 /a /f $env:PFX_PATH /p 1111 "build\windows\Release\Receiver.exe"
            & $signtool sign /v /fd SHA256 /a /f $env:PFX_PATH /p 1111 "build\windows\Release\VirtualCameraMediaSource.dll"
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMVirtualCamera-Windows
          path: |
            build/windows/Release/Receiver.exe
            build/windows/Release/VirtualCameraMediaSource.dll
